apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.0
    helm:
      releaseName: monitoring
      valueFiles:
      - $values/observability/monitoring.yaml
  - repoURL: https://github.com/iDsniel/togglemaster-fase3.git
    targetRevision: feat/fase4-observability
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
---
